name: Evaluate Foundry Agent

on:
  workflow_dispatch:
    inputs:
      agent_version:
        description: Optional Foundry agent version override
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      agent_version:
        description: Optional Foundry agent version override
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ai300-eval
  cancel-in-progress: true

env:
  FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
  FOUNDRY_JUDGE_DEPLOYMENT: ${{ vars.FOUNDRY_JUDGE_DEPLOYMENT }}
  FOUNDRY_AGENT_NAME: ${{ vars.FOUNDRY_AGENT_NAME }}
  FOUNDRY_AGENT_VERSION: ${{ inputs.agent_version || vars.FOUNDRY_AGENT_VERSION || '' }}
  QUALITY_GRADER_EVALUATOR_NAME: ${{ vars.QUALITY_GRADER_EVALUATOR_NAME || 'builtin.quality_grader' }}
  GOLDEN_DATASET: ${{ vars.GOLDEN_DATASET || './golden_dataset.jsonl' }}
  CONTEXT_DIR: ${{ vars.CONTEXT_DIR || './rag' }}
  DATASET_NAME: ${{ vars.DATASET_NAME || 'MS-AI300-Golden-Dataset' }}
  POLL_SECONDS: ${{ vars.EVAL_POLL_SECONDS || '5' }}
  EVAL_NAME_PREFIX: ${{ vars.EVAL_NAME_PREFIX || 'MS-AI300-with-thngoc' }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Evaluation Configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FOUNDRY_PROJECT_ENDPOINT" ]] || { echo '::error::Missing FOUNDRY_PROJECT_ENDPOINT.'; exit 1; }
          [[ -n "$FOUNDRY_JUDGE_DEPLOYMENT" ]] || { echo '::error::Missing FOUNDRY_JUDGE_DEPLOYMENT.'; exit 1; }
          [[ -n "$FOUNDRY_AGENT_NAME" ]] || { echo '::error::Missing FOUNDRY_AGENT_NAME.'; exit 1; }
          test -f "$GOLDEN_DATASET" || { echo "::error::Golden dataset not found: $GOLDEN_DATASET"; exit 1; }
          test -d "$CONTEXT_DIR" || { echo "::error::Context directory not found: $CONTEXT_DIR"; exit 1; }

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Evaluation SDK
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'azure-ai-projects==2.7.0' \
            'azure-identity' \
            'python-dotenv'

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Foundry Evaluation
        shell: bash
        run: |
          set -euo pipefail
          echo "Judge deployment : $FOUNDRY_JUDGE_DEPLOYMENT"
          echo "Target agent     : $FOUNDRY_AGENT_NAME"
          echo "Agent version    : ${FOUNDRY_AGENT_VERSION:-latest}"
          echo "Golden dataset   : $GOLDEN_DATASET"
          echo "Context directory: $CONTEXT_DIR"
          python src/eval/run_eval.py
