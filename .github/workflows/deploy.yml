name: Foundry LLMOps Pipeline - Agent & Search

on:
  push:
    tags:
      - 'v*.*.*' # Chạy khi gắn release tag chuẩn git (vd: v1.0.0)

env:
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'foundry-agent-rg' }}
  # Các giá trị dưới đây PHẢI khớp chính xác với default trong
  # src/agent/config.py và docstring của evals/run_eval.py — không đổi ở
  # đây mà không đổi cả 2 chỗ kia.
  AZURE_SEARCH_INDEX_NAME: "ai300-notes-index"
  AZURE_SEARCH_CONNECTION_NAME: "SearchServiceConnection"
  FOUNDRY_AGENT_NAME: "support-agent"
  GOLDEN_DATASET: "evals/test_dataset.jsonl"

jobs:
  # =========================================================================
  # JOB 1: Đảm bảo hạ tầng Foundry (account + project MỚI), Search, Model
  #        deployment đã sẵn sàng — và XUẤT output để Job 2 dùng trực tiếp,
  #        thay vì dò lại resource bằng CLI (fragile, dễ lệch khi đổi tên).
  # =========================================================================
  ensure-infra:
    runs-on: ubuntu-latest
    outputs:
      foundry_project_endpoint: ${{ steps.bicep-deploy.outputs.foundry_project_endpoint }}
      agent_model_deployment_name: ${{ steps.bicep-deploy.outputs.agent_model_deployment_name }}
      search_service_name: ${{ steps.bicep-deploy.outputs.search_service_name }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infrastructure via Bicep
        id: bicep-deploy
        run: |
          echo "Đang kiểm tra và cập nhật hạ tầng tại Resource Group: ${{ env.RESOURCE_GROUP }}..."
          DEPLOY_OUTPUT=$(az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --query properties.outputs \
            --output json)

          echo "foundry_project_endpoint=$(echo "$DEPLOY_OUTPUT" | jq -r '.foundryProjectEndpoint.value')" >> "$GITHUB_OUTPUT"
          echo "agent_model_deployment_name=$(echo "$DEPLOY_OUTPUT" | jq -r '.agentModelDeploymentName.value')" >> "$GITHUB_OUTPUT"
          echo "search_service_name=$(echo "$DEPLOY_OUTPUT" | jq -r '.searchServiceName.value')" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # JOB 2: Sync Index schema, Sync Agent definition, chạy Eval Quality Gate,
  #        Smoke Test — theo đúng thứ tự phụ thuộc (Agent cần Index đã tồn
  #        tại trước khi gắn tool; Eval cần Agent đã tồn tại trước khi test).
  # =========================================================================
  deploy-eval-and-smoke-test:
    needs: ensure-infra
    runs-on: ubuntu-latest
    env:
      # Các biến này CHỈ biết được sau khi Job 1 deploy xong — không đưa
      # được lên env cấp workflow.
      FOUNDRY_PROJECT_ENDPOINT: ${{ needs.ensure-infra.outputs.foundry_project_endpoint }}
      FOUNDRY_AGENT_MODEL_DEPLOYMENT: ${{ needs.ensure-infra.outputs.agent_model_deployment_name }}
      # Dùng lại CHÍNH model của Agent để làm judge cho evaluator. Đây là
      # lựa chọn tối giản, KHÔNG phải best practice — dùng cùng 1 model vừa
      # sinh câu trả lời vừa chấm điểm câu trả lời của chính nó có thể làm
      # lệch (bias) kết quả eval. Nếu muốn đúng chuẩn, thêm 1
      # Microsoft.CognitiveServices/accounts/deployments riêng trong
      # main.bicep cho model judge (vd. một bản rẻ/nhanh hơn) rồi trỏ biến
      # này sang deployment đó thay vì dùng chung agent_model_deployment_name.
      FOUNDRY_JUDGE_DEPLOYMENT: ${{ needs.ensure-infra.outputs.agent_model_deployment_name }}
      AZURE_SEARCH_ENDPOINT: https://${{ needs.ensure-infra.outputs.search_service_name }}.search.windows.net
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Idempotent Index Sync: gọi THẲNG create-index.py — đây là nguồn xác
      # thực (source of truth) duy nhất của schema, tự xoá/tạo lại index
      # sạch mỗi lần chạy. Không dùng file JSON schema rời (infra/
      # search_index_schema.json) vì file đó không tồn tại và sẽ dễ lệch
      # với schema thật trong create-index.py theo thời gian.
      - name: Create or Update Azure AI Search Index (Idempotent)
        run: python src/create-index.py

      # Đăng ký / nâng version Agent bằng chính src/agent/core.py — không
      # còn đoạn python -c gọi from_connection_string đã bị SDK loại bỏ.
      - name: Sync Agent Definition (Prompt Agent) lên Foundry
        run: |
          python -c "
          from src.agent.core import FoundryRagAgent

          agent = FoundryRagAgent()
          agent.create_or_update()
          "

      # Quality Gate: Chạy đánh giá định lượng bằng azure-ai-evaluation.
      # Toàn bộ biến FOUNDRY_PROJECT_ENDPOINT / FOUNDRY_AGENT_NAME /
      # FOUNDRY_JUDGE_DEPLOYMENT / GOLDEN_DATASET đã được set ở trên —
      # run_eval.py sẽ tự exit 1 nếu bất kỳ threshold nào trong
      # evals/threshold.json không đạt.
      - name: Run Automated Evaluation Quality Gate
        run: python evals/run_eval.py

      # Smoke Test — gọi Agent THẬT qua 1 câu hỏi mẫu, fail job nếu câu trả
      # lời rỗng hoặc bị guardrails chặn (khác bản cũ chỉ print() cố định,
      # không bao giờ fail).
      - name: Smoke Test Agent Execution
        run: |
          python -c "
          import sys
          from src.agent.core import FoundryRagAgent

          agent = FoundryRagAgent()
          result = agent.ask('RBAC là gì? Sự khác nhau giữa Control Plane và Data Plane?')

          if not result['answer'].strip():
              print('::error::Agent trả về câu trả lời rỗng.')
              sys.exit(1)

          if 'guardrails' in result['answer'].lower():
              print('::error::Smoke test bị chặn bởi Content Safety guardrails.')
              sys.exit(1)

          print('Agent phản hồi thành công, vượt qua Smoke Test:')
          print(result['answer'][:300])
          "