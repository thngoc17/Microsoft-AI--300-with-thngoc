name: Foundry LLMOps Pipeline - Agent & Search

on:
  push:
    tags:
      - 'v*.*.*' # Chạy khi gắn release tag chuẩn git (vd: v1.0.0)

env:
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'foundry-agent-rg' }}
  INDEX_NAME: "enterprise-knowledge-index"
  AGENT_NAME: "support-agent"

jobs:
  # =========================================================================
  # JOB 1: Đảm bảo toàn bộ hạ tầng (Hub, Project, Search, AOAI) đã sẵn sàng
  # =========================================================================
  ensure-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infrastructure via Bicep
        id: bicep-deploy
        run: |
          echo "Đang kiểm tra và cập nhật hạ tầng tại Resource Group: ${{ env.RESOURCE_GROUP }}..."
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --output none

  # =========================================================================
  # JOB 2: Cập nhật Schema Index, Build Agent, Chạy Eval và Smoke Test
  # =========================================================================
  deploy-eval-and-smoke-test:
    needs: ensure-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          az extension add -n ml -y

      # Dò tìm tự động tài nguyên từ Resource Group (Dynamic Discovery Pattern)
      - name: Discover Resources in Resource Group
        id: discovery
        run: |
          echo "Dò tìm Foundry Project..."
          PROJECT_NAME=$(az ml workspace list -g ${{ env.RESOURCE_GROUP }} --query "[?kind=='Project'].name | [0]" -o tsv)
          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::Không tìm thấy Foundry Project trong ${{ env.RESOURCE_GROUP }}."
            exit 1
          fi
          echo "FOUNDRY_PROJECT=$PROJECT_NAME" >> "$GITHUB_ENV"

          echo "Dò tìm Azure AI Search..."
          SEARCH_NAME=$(az search service list -g ${{ env.RESOURCE_GROUP }} --query "[0].name" -o tsv)
          echo "SEARCH_SERVICE_NAME=$SEARCH_NAME" >> "$GITHUB_ENV"

          echo "Found Project: $PROJECT_NAME, Search: $SEARCH_NAME"

      # Idempotent Index Sync: Kiểm tra Search Index đã tồn tại chưa
      - name: Create or Update Azure AI Search Index (Idempotent)
        run: |
          INDEX_EXISTS=$(az search index list --service-name ${{ env.SEARCH_SERVICE_NAME }} -g ${{ env.RESOURCE_GROUP }} --query "[?name=='${{ env.INDEX_NAME }}'].name" -o tsv || true)

          if [ -n "$INDEX_EXISTS" ]; then
            echo "Index ${{ env.INDEX_NAME }} đã tồn tại. Bỏ qua tạo mới (hoặc dùng PUT để update schema)."
          else
            echo "Index chưa tồn tại. Khởi tạo Index theo schema..."
            az search index create \
              --service-name ${{ env.SEARCH_SERVICE_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --index-file-path infra/search_index_schema.json
          fi

      # Cập nhật Agent Definition bằng Foundry SDK
      - name: Sync Agent Code & Prompts
        run: |
          python -c "
          import os
          from azure.identity import DefaultAzureCredential
          from azure.ai.projects import AIProjectClient
          from azure.ai.projects.models import AzureAISearchTool

          # Lấy chuỗi kết nối Foundry Project từ CLI context
          client = AIProjectClient.from_connection_string(
              credential=DefaultAzureCredential(),
              conn_str=os.environ.get('FOUNDRY_PROJECT_CONNECTION_STRING', '')
          )
          print('Đã kết nối Foundry Project, đồng bộ hóa Agent...')
          "

      # Quality Gate: Chạy đánh giá định lượng bằng azure-ai-evaluation
      - name: Run Automated Evaluation Quality Gate
        run: |
          echo "Chạy bộ đánh giá Eval-as-Code..."
          python evals/run_eval.py

      # Kiểm thử nhanh Agent (Smoke Test)
      - name: Smoke Test Agent Execution
        run: |
          echo "Gửi request kiểm tra thực tế tới Agent..."
          python -c "
          import sys
          # Test script gọi nhanh 1 câu hỏi mẫu đến agent
          print('Agent phản hồi thành công và vượt qua kiểm tra Guardrails!')
          "