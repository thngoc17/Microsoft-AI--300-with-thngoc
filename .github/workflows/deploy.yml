name: Deploy Qwen Azure ML Endpoint

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-deploy-${{ vars.RESOURCE_GROUP || 'digital-twin-rg' }}
  cancel-in-progress: false

env:
  WORKSPACE: ${{ vars.WORKSPACE || 'qwen-twin-workspace' }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'digital-twin-rg' }}
  IMAGE_NAME: qwen-rag-api
  ENDPOINT_NAME: qwen-rag-endpoint-ver1
  DEPLOYMENT_NAME: rag-deployment-ver1
  IMAGE_TAG: v1.${{ github.run_number }}

jobs:
  build-register-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML Extension
        shell: bash
        run: az extension add -n ml -y

      - name: Set Default Azure ML Workspace
        shell: bash
        run: |
          set -euo pipefail
          az configure --defaults \
            workspace="$WORKSPACE" \
            group="$RESOURCE_GROUP"

      - name: Discover ACR in Resource Group
        shell: bash
        run: |
          set -euo pipefail
          ACR_NAME="$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?tags.RagRole=='search' || tags.RagRole=='source'].name | [0]" \
            -o tsv)"
          if [[ -z "$ACR_NAME" ]]; then
            ACR_NAME="$(az acr list --resource-group "$RESOURCE_GROUP" --query '[0].name' -o tsv)"
          fi
          [[ -n "$ACR_NAME" ]] || {
            echo "::error::No ACR found in $RESOURCE_GROUP. Run infra workflow first."
            exit 1
          }
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "ACR=$ACR_NAME"

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build & Push Docker Image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Target Image URI: $IMAGE_URI"

          sed -i "s|image: .*|image: $IMAGE_URI|g" azure/deployment.yml

          if az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --query "[?@=='${IMAGE_TAG}']" \
            -o tsv 2>/dev/null | grep -q .; then
            echo "Image tag already exists; skipping build/push."
          else
            docker build -t "$IMAGE_URI" .
            docker push "$IMAGE_URI"
          fi

      - name: Register Profile Data Asset (idempotent)
        shell: bash
        run: |
          set -euo pipefail
          DATA_NAME="$(grep '^name:' azure/profile_data.yml | awk '{print $2}')"
          DATA_VERSION="$(grep '^version:' azure/profile_data.yml | awk '{print $2}')"
          if az ml data show --name "$DATA_NAME" --version "$DATA_VERSION" >/dev/null 2>&1; then
            echo "Data asset $DATA_NAME v$DATA_VERSION already exists; skipping."
          else
            az ml data create -f azure/profile_data.yml
          fi

      - name: Register Knowledge Base Vector DB Asset
        run: az ml data create -f azure/knowledge_db.yml

      - name: Register Qwen GGUF Model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_NAME="$(grep '^name:' azure/model.yml | awk '{print $2}')"
          MODEL_VERSION="$(grep '^version:' azure/model.yml | awk '{print $2}')"

          if [[ -n "$MODEL_VERSION" ]] && az ml model show --name "$MODEL_NAME" --version "$MODEL_VERSION" >/dev/null 2>&1; then
            echo "Model $MODEL_NAME v$MODEL_VERSION already exists; skipping registration."
          else
            az ml model create -f azure/model.yml
          fi

      - name: Create or Update Online Endpoint
        shell: bash
        run: |
          set -euo pipefail
          if az ml online-endpoint show --name "$ENDPOINT_NAME" >/dev/null 2>&1; then
            echo "Endpoint exists; updating endpoint configuration."
            az ml online-endpoint update --name "$ENDPOINT_NAME" -f azure/endpoint.yml
          else
            echo "Creating endpoint."
            az ml online-endpoint create --name "$ENDPOINT_NAME" -f azure/endpoint.yml
          fi

      - name: Create or Update Online Deployment
        shell: bash
        run: |
          set -euo pipefail
          if az ml online-deployment show \
            --name "$DEPLOYMENT_NAME" \
            --endpoint-name "$ENDPOINT_NAME" >/dev/null 2>&1; then
            az ml online-deployment update \
              --name "$DEPLOYMENT_NAME" \
              --endpoint-name "$ENDPOINT_NAME" \
              -f azure/deployment.yml
          else
            az ml online-deployment create \
              --name "$DEPLOYMENT_NAME" \
              --endpoint-name "$ENDPOINT_NAME" \
              -f azure/deployment.yml
          fi

      - name: Route Traffic to Deployment
        run: |
          az ml online-endpoint update \
            --name "$ENDPOINT_NAME" \
            --traffic "$DEPLOYMENT_NAME=100"

      - name: Smoke Test Endpoint
        shell: bash
        run: |
          set -euo pipefail
          SCORING_URI="$(az ml online-endpoint show --name "$ENDPOINT_NAME" --query scoring_uri -o tsv)"
          KEY="$(az ml online-endpoint get-credentials --name "$ENDPOINT_NAME" --query primaryKey -o tsv)"
          curl --fail --silent --show-error --request POST "$SCORING_URI" \
            --header "Authorization: Bearer $KEY" \
            --header 'Content-Type: application/json' \
            --data '{"messages":[{"role":"user","content":"Xin chào"}],"max_tokens":32}' \
            >/tmp/smoke-test.json
          cat /tmp/smoke-test.json
